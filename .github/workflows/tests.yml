name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: pip

    # opencv-contrib-python (not the headless build) links against libGL,
    # which the runner image does not ship
    - name: Install OpenCV system libraries
      run: sudo apt-get update && sudo apt-get install -y libgl1 libglib2.0-0

    # keep the CUDA wheels out; they are ~2 GB and the tests run on CPU
    - name: Install CPU-only PyTorch
      run: pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu

    - name: Install package with dev dependencies
      run: pip install -e ".[dev]"

    - name: Run tests
      run: pytest --cov --cov-report=term-missing
