[project]
name = "towbintools"
version = "0.5.0"
authors = [
  {name="Sacha Psalmon", email="sacha.psalmon@unibe.ch" },
  {name="Boris Gusev", email="boris.gusev@unibe.ch" }
]
maintainers = [
    {name = "Sacha Psalmon", email="sacha.psalmon@unibe.ch"},
]
description = "All the tools used by the Towbin Lab !"
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "torch",
    "pytorch-lightning",
    "torchmetrics",
    "pytorch-toolbelt",
    "segmentation-models-pytorch",
    "timm",
    "monai",
    "csbdeep",

    "scikit-learn",
    "xgboost",
    "joblib",

    "opencv-contrib-python",
    "scikit-image",
    "tifffile",

    "numpy",
    "pandas",
    "polars",
    "pyarrow",
    "scipy",
    "ome-types",
    "pyyaml",

    "whittaker-eilers",
    "bottleneck",
    "matplotlib",
    "seaborn",
    "microfilm",
    "statsmodels",
    "statannotations",
]

[project.optional-dependencies]
dev=[
    "black",
    "isort",
    "pre-commit",
    "pytest",
    "pytest-cov",
]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
# import the checked-out package, never a stale copy in site-packages
pythonpath = ["."]
addopts = ["--import-mode=importlib", "--strict-markers", "-ra"]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::FutureWarning",
]

[tool.coverage.run]
source = ["towbintools"]

[tool.coverage.report]
show_missing = true
skip_covered = true
# the suite sits at 95%; the floor leaves room for a refactor without
# silently letting coverage rot
fail_under = 93
